name: Deploy Azure Function (my-function-app)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (inside my-function-app)
        run: |
          cd my-function-app
          npm ci || npm install

      - name: Create deployment package (zip only the function project)
        run: |
          cd my-function-app
          zip -r ../app.zip .

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: testbuddyfunctionapp
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: app.zip